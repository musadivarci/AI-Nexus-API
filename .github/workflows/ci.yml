name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AINexus.sln
      - run: dotnet build AINexus.sln --configuration Release --no-restore
      - run: dotnet test AINexus.sln --configuration Release --no-build
